[package]
name = "srd_recap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.6.7", features = ["derive"] }
mcap = "0.25.0"
mcapdecode-core = "0.7.0"
mcapdecode-ros2msg = "0.7.0"
memmap2 = "0.9.11"
regex = "1.13.1"
tempfile = "3.27.0"
walkdir = "2.5.0"

[[bin]]
name = "recap"
path = "src/main.rs"
